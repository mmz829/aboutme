<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>chihiro</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = t === "light" ? "light" : "rose";
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.2.6/400.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@sarap422/font-hackgen@1.0.0/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="editor">
    <header class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="titlebar-text">chihiro — ~/aboutme</span>
      <button type="button" class="theme-switch" id="theme-btn" role="switch" aria-checked="true" aria-label="ライトテーマに切り替え">
        <svg class="theme-switch-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.6 2.6a8.6 8.6 0 1 0 6.8 12.8A7 7 0 0 1 14.6 2.6z"/></svg>
        <svg class="theme-switch-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 2.6v2.1M12 19.3v2.1M4.8 4.8l1.5 1.5M17.7 17.7l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.8 19.2l1.5-1.5M17.7 6.3l1.5-1.5"/></svg>
        <span class="theme-switch-thumb"></span>
      </button>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <p class="sidebar-head">EXPLORER</p>
        <p class="tree-dir">▾ aboutme</p>
        <ul class="tree" id="tree"></ul>
      </aside>

      <div class="main">
        <nav class="tabs" id="tabs"></nav>
        <div class="files" id="files"></div>
      </div>
    </div>

    <footer class="statusbar">
      <span>⎇ main</span>
      <span id="status-file">README.md</span>
      <span class="status-right">UTF-8</span>
      <span>(=^･ω･^=)</span>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
